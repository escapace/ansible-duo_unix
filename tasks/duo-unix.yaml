---
- name: validate duo_unix inputs
  ansible.builtin.import_tasks: validate.yaml

- name: install duo_unix package prerequisites
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - policycoreutils
      - selinux-policy-targeted
    state: present

- name: import the duo_unix repository signing key
  ansible.builtin.rpm_key:
    key: "{{ duo_unix_repository_key_url }}"
    fingerprint: "{{ duo_unix_repository_key_fingerprints }}"
    state: present

- name: configure the duo_unix repository
  ansible.builtin.yum_repository:
    name: duosecurity
    description: Duo Security Repository
    baseurl: >-
      https://pkg.duosecurity.com/{{ duo_unix_repository_paths[ansible_facts["distribution"]] }}/$releasever/$basearch
    enabled: true
    gpgcheck: true
    gpgkey: "{{ duo_unix_repository_key_url }}"
    mode: "0644"

- name: install duo_unix
  ansible.builtin.dnf:
    name: duo_unix
    state: present
  register: duo_unix_package

- name: inspect the selinux policy management tool
  ansible.builtin.stat:
    path: /usr/sbin/semodule
  register: duo_unix_semodule

- name: inspect installed selinux policy modules for duo_unix
  ansible.builtin.command:
    argv:
      - /usr/sbin/semodule
      - --list-modules=full
  changed_when: false
  register: duo_unix_selinux_modules
  check_mode: false
  when: duo_unix_semodule.stat.executable | default(false)

- name: install the duo_unix selinux policy module
  ansible.builtin.command:
    argv:
      - /usr/sbin/semodule
      - --noreload
      - --install
      - /usr/share/selinux/packages/authlogin_duo.pp.bz2
  when:
    - not ansible_check_mode
    - >-
      duo_unix_package.changed
      or (
        duo_unix_selinux_modules.stdout_lines
        | select('match', '^[0-9]+[ ]+authlogin_duo[ ]+')
        | list
        | length == 0
      )
  changed_when: true
  notify:
    - duo_unix reload selinux policy

- name: verify the duo_unix selinux policy module
  ansible.builtin.command:
    argv:
      - /usr/sbin/semodule
      - --list-modules=full
  changed_when: false
  register: duo_unix_verified_selinux_modules
  check_mode: false
  when: duo_unix_semodule.stat.executable | default(false)

- name: validate the duo_unix selinux policy module
  ansible.builtin.assert:
    that:
      - >-
        duo_unix_verified_selinux_modules.stdout_lines
        | select('match', '^[0-9]+[ ]+authlogin_duo[ ]+')
        | list
        | length == 1
    fail_msg: >-
      The authlogin_duo SELinux policy module was not installed.
    quiet: true
  when: not ansible_check_mode

- name: configure duo_unix
  ansible.builtin.template:
    src: pam_duo.conf.j2
    dest: /etc/duo/pam_duo.conf
    owner: root
    group: root
    mode: "0600"
  diff: false
  no_log: true
  notify:
    - duo_unix restart sshd

- name: configure ssh pam for duo_unix
  ansible.builtin.template:
    src: sshd.j2
    dest: /etc/pam.d/sshd
    owner: root
    group: root
    mode: "0644"
  notify:
    - duo_unix restart sshd
