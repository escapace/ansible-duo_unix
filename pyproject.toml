[project]
name = "ansible-duo-unix"
version = "0.0.0"
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
  "ansible==14.4.0",
  "ansible-lint==26.8.0; sys_platform == 'linux'",
  "docker==7.2.0",
  "molecule==26.8.0",
  "molecule-plugins[docker]==26.7.15",
  "netaddr==1.3.0",
  "passlib==1.7.4",
  "segno==1.6.6"
]

[tool.uv]
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'"
]
managed = true

[tool.uv.workspace]
members = []

[tool.setuptools]
py-modules = []
